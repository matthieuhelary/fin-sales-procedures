<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procédures Fin — Guide d'entretien ADV / Commerciaux</title>
<style>
  :root{
    --bg:#F6F6F3;
    --surface:#FFFFFF;
    --border:#E4E2DC;
    --border-strong:#D6D3CA;
    --text:#211F1B;
    --text-muted:#6F6C64;
    --text-faint:#9C988E;

    --violet-bg:#EFEAFB; --violet:#6D3FD0;
    --green-bg:#DFF6E6;  --green:#187A43;
    --orange-bg:#FDE7D2; --orange:#B85C13;
    --yellow-bg:#FCF0C8; --yellow:#8A5A05;

    --attr-bg:#EEF1FC; --attr-text:#38408A; --attr-border:#C9D0F0;
    --blank-bg:#FFF6EC; --blank-text:#9A5B12; --blank-border:#EFC796;

    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:14.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:262px;
    flex:none;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 12px 20px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-title{
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--text-faint);
    padding:0 10px 12px;
  }
  .proc-nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .proc-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    text-align:left;
    padding:9px 10px;
    border-radius:8px;
    border:none;
    background:transparent;
    cursor:pointer;
    font:inherit;
    color:var(--text);
  }
  .proc-item:hover{background:#F1F0EC;}
  .proc-item.active{background:#F0ECFB;}
  .proc-badge{
    flex:none;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--border);
    color:var(--text-muted);
    font-size:11.5px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .proc-item.active .proc-badge{background:var(--violet);color:#fff;}
  .proc-item-name{font-size:13.6px;font-weight:560;line-height:1.35;}
  .proc-item-sub{font-size:11.8px;color:var(--text-muted);margin-top:2px;line-height:1.3;}
  .proc-item-count{
    font-size:11px;
    color:var(--blank-text);
    background:var(--blank-bg);
    border:1px solid var(--blank-border);
    border-radius:20px;
    padding:1px 7px;
    display:inline-block;
    margin-top:5px;
  }

  .sidebar-foot{
    margin-top:18px;
    padding:12px 10px 0;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .help-btn{
    width:100%;
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#FBFBFA;
    color:var(--text);
    font:inherit;font-size:13px;font-weight:550;
    cursor:pointer;
  }
  .help-btn:hover{background:#F1F0EC;}

  .lang-switch{
    display:flex;
    border:1px solid var(--border-strong);
    border-radius:8px;
    overflow:hidden;
  }
  .lang-btn{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:7px 6px;
    border:none;
    background:#fff;
    color:var(--text-muted);
    font:inherit;font-size:12.6px;font-weight:600;
    cursor:pointer;
  }
  .lang-btn + .lang-btn{border-left:1px solid var(--border-strong);}
  .lang-btn.active{background:var(--violet-bg);color:var(--violet);}
  .lang-btn:hover:not(.active){background:#F6F5F2;}
  .lang-flag{font-size:14px;line-height:1;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 28px;
    display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;
  }
  .topbar-title-wrap{display:flex;flex-direction:column;min-width:0;margin-right:auto;}
  .topbar-title{display:flex;align-items:center;gap:10px;}
  .topbar-title h1{font-size:18.5px;font-weight:650;margin:0;letter-spacing:-.01em;}
  .pill{
    font-size:11px;font-weight:600;
    padding:2.5px 9px;border-radius:20px;
    background:var(--yellow-bg);color:var(--yellow);
    border:1px solid #EFDFA0;
    white-space:nowrap;
  }
  .topbar-sub{font-size:12.6px;color:var(--text-muted);margin-top:2px;}
  .toolbar{display:flex;gap:8px;flex:none;}
  .tbtn{
    font:inherit;font-size:12.8px;font-weight:560;
    border:1px solid var(--border-strong);
    background:#fff;color:var(--text);
    border-radius:8px;
    padding:7px 12px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .tbtn:hover{background:#F6F5F2;}
  .tbtn.dark{background:var(--text);border-color:var(--text);color:#fff;}
  .tbtn.dark:hover{background:#3a3730;}

  .content{
    padding:26px 32px 90px;
    max-width:900px;
  }

  .intro-note{
    background:#F4F2FC;
    border:1px solid #E1DAF7;
    color:#4A3D8F;
    border-radius:var(--radius);
    padding:12px 15px;
    font-size:13.4px;
    margin-bottom:20px;
  }

  .attrs-row{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-bottom:26px;
  }
  .attrs-label{
    font-size:11.5px;color:var(--text-faint);font-weight:600;
    letter-spacing:.02em;
    margin-right:4px;
    align-self:center;
  }

  /* ---------- Sections ---------- */
  .section{margin-bottom:6px;}
  .section-head{
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
    padding:10px 0;
    border-top:1px solid var(--border);
    user-select:none;
  }
  .section:first-of-type .section-head{border-top:none;}
  .section-chevron{
    flex:none;width:16px;height:16px;color:var(--text-faint);
    transition:transform .15s ease;
  }
  .section.collapsed .section-chevron{transform:rotate(-90deg);}
  .section-title{font-size:14.5px;font-weight:640;}
  .section-body{padding:4px 0 22px 2px;}
  .section.collapsed .section-body{display:none;}

  /* ---------- Branch cards ---------- */
  .branch{
    display:flex;gap:10px;
    padding:14px 0;
    border-top:1px dashed var(--border);
  }
  .branch:first-child{border-top:none;}
  .branch-num{
    flex:none;
    font-size:12.5px;
    color:var(--text-faint);
    padding-top:9px;
    width:34px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .branch-main{flex:1;min-width:0;}
  .branch-label-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
  .type-chip{
    flex:none;width:21px;height:21px;border-radius:6px;
    background:var(--violet-bg);color:var(--violet);
    display:flex;align-items:center;justify-content:center;
  }
  .branch-label{font-size:12.6px;font-weight:700;letter-spacing:.03em;color:var(--text);}

  .cond-box{
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    padding:11px 14px;
    font-size:13.8px;
    color:var(--text);
    margin-bottom:10px;
  }

  .actions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .action{display:flex;gap:9px;align-items:flex-start;}
  .action-num{
    flex:none;font-size:12.5px;color:var(--text-faint);
    width:15px;padding-top:1px;font-variant-numeric:tabular-nums;
  }
  .action-body{flex:1;min-width:0;font-size:13.6px;}

  .action.sub .action-body{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .icon-chip{
    flex:none;width:19px;height:19px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-chip.violet{background:var(--violet-bg);color:var(--violet);}
  .icon-chip.orange{background:var(--orange-bg);color:var(--orange);}
  .icon-chip.green{background:var(--green-bg);color:var(--green);}
  .subproc-link{color:var(--text);text-decoration:underline;text-decoration-color:var(--border-strong);font-weight:560;}
  .subproc-name{font-weight:650;text-decoration:underline;text-decoration-color:var(--border-strong);}
  .subproc-arrow{color:var(--text-faint);}

  .action.end .action-body{display:flex;align-items:center;gap:7px;color:var(--text-muted);}

  .team-card{
    background:#FDFBF7;
    border:1px solid var(--orange-bg);
    border-left:3px solid var(--orange);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .team-card-head{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
  .team-card-head span{font-size:11.8px;font-weight:650;color:var(--orange);letter-spacing:.02em;}
  .team-card-body{font-size:13.5px;color:var(--text);}
  .team-card-foot{
    margin-top:9px;padding-top:8px;border-top:1px solid #F1E6D8;
    font-size:11.3px;color:var(--text-faint);
  }

  /* inline tokens */
  .attr-chip{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--attr-bg);color:var(--attr-text);
    border:1px solid var(--attr-border);
    border-radius:5px;padding:0px 5px;
    font-size:12.6px;font-weight:560;
    text-decoration:underline;text-decoration-color:#B9C2ED;
    white-space:nowrap;
  }
  .blank-chip{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--blank-bg);color:var(--blank-text);
    border:1px dashed var(--blank-border);
    border-radius:5px;padding:0px 6px;
    font-size:12.4px;font-style:italic;font-weight:520;
    white-space:nowrap;
  }
  .update-chip{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--yellow-bg);color:var(--yellow);
    border:1px solid #EFDFA0;
    border-radius:5px;padding:0px 5px;
    font-size:12.6px;font-weight:560;
    text-decoration:underline;text-decoration-color:#E3C877;
    white-space:nowrap;
  }
  .call-chip{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--green-bg);color:var(--green);
    border:1px solid #BFE9CC;
    border-radius:5px;padding:0px 5px;
    font-size:12.6px;font-weight:560;
    text-decoration:underline;text-decoration-color:#8FCFA5;
    white-space:nowrap;
  }
  .chip-svg{width:11px;height:11px;flex:none;}

  /* ---------- Sub-procedures footer ---------- */
  .subprocs{
    margin-top:8px;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  .subprocs-title{font-size:12px;font-weight:650;color:var(--text-faint);letter-spacing:.02em;margin-bottom:10px;}
  .subprocs-list{display:flex;flex-wrap:wrap;gap:7px;}
  .subproc-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:8px;padding:6px 10px;
    font-size:12.6px;font-weight:550;
  }

  /* ---------- Legend / help panel ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(30,28,22,.32);
    display:none;align-items:flex-start;justify-content:flex-end;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .panel{
    width:420px;max-width:92vw;height:100vh;
    background:var(--surface);
    box-shadow:-8px 0 28px rgba(0,0,0,.12);
    padding:24px 24px 40px;
    overflow-y:auto;
  }
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .panel-head h2{font-size:17px;margin:0;font-weight:650;}
  .panel-close{border:none;background:none;cursor:pointer;color:var(--text-muted);padding:4px;}
  .panel-sub{font-size:12.8px;color:var(--text-muted);margin-bottom:18px;}
  .legend-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:26px;}
  .legend-table th{
    text-align:left;font-size:11px;color:var(--text-faint);
    font-weight:650;letter-spacing:.02em;
    padding-bottom:7px;border-bottom:1px solid var(--border);
  }
  .legend-table td{padding:9px 8px 9px 0;border-bottom:1px solid #F0EFEA;vertical-align:top;}
  .legend-table td:first-child{white-space:nowrap;padding-right:12px;}
  .panel h3{font-size:13px;margin:0 0 10px;font-weight:650;}
  .atelier-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .atelier-list li{display:flex;gap:10px;font-size:13px;}
  .atelier-time{flex:none;width:52px;color:var(--text-faint);font-variant-numeric:tabular-nums;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%;height:auto;position:static;
      border-right:none;border-bottom:1px solid var(--border);
      padding:14px 10px;
    }
    .proc-nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;}
    .proc-item{flex:none;width:auto;flex-direction:column;align-items:center;text-align:center;min-width:96px;}
    .proc-item-sub,.proc-item-count{display:none;}
    .content{padding:20px 16px 70px;}
    .topbar{padding:12px 16px;}
  }

  @media print{
    .sidebar,.toolbar,.overlay{display:none !important;}
    .topbar{position:static;border-bottom:2px solid #000;}
    .content{max-width:none;padding:0;}
    body{background:#fff;}
    .section.collapsed .section-body{display:block !important;}
    .section-chevron{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-title" id="sidebarTitle"></div>
    <ul class="proc-nav" id="procNav"></ul>
    <div class="sidebar-foot">
      <div class="lang-switch">
        <button class="lang-btn" id="langFr" data-lang="fr"><span class="lang-flag">🇫🇷</span> FR</button>
        <button class="lang-btn" id="langEn" data-lang="en"><span class="lang-flag">🇬🇧</span> EN</button>
      </div>
      <button class="help-btn" id="legendBtn">
        <svg class="chip-svg" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.6-2.5 1.9-2.5 3.5"/><circle cx="12" cy="17" r=".1" fill="currentColor" stroke-width="2.5"/></svg>
        <span id="legendBtnLabel"></span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title-wrap">
        <div class="topbar-title">
          <h1 id="procTitle"></h1>
          <span class="pill" id="draftPill"></span>
        </div>
        <div class="topbar-sub" id="procSub"></div>
      </div>
      <div class="toolbar">
        <button class="tbtn" id="toggleAllBtn"></button>
        <button class="tbtn dark" id="printBtn" onclick="window.print()">
          <svg class="chip-svg" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
          <span id="printBtnLabel"></span>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <button class="panel-close" id="panelClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-sub" id="panelSub"></div>
    <div id="legendContent"></div>
  </div>
</div>

<script>
/* ---------------- Language helper ---------------- */
let LANG = 'fr';
function L(fr, en){ return { fr: fr, en: en }; }
function T(x){
  if(x && typeof x === 'object' && ('fr' in x)) return x[LANG];
  return x;
}

/* ---------------- Icons ---------------- */
const ICONS = {
  branchArrow: '<svg class="chip-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  update: '<svg class="chip-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  call: '<svg class="chip-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h13M15 3l4 4-4 4"/><path d="M18 17H5M9 21l-4-4 4-4"/></svg>',
  attr: '<svg class="chip-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6L2 12l6 6M16 6l6 6-6 6"/></svg>',
  sub: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><path d="M9 6h11"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><path d="M9 12h11"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/><path d="M9 18h11"/></svg>',
  team: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>',
  end: '<svg class="chip-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
  chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------------- UI strings ---------------- */
const UI = {
  sidebarTitle: L("Procédures Fin", "Fin procedures"),
  legendBtnLabel: L("Comment lire l'écran", "How to read the screen"),
  draftPill: L("Brouillon — à trancher en atelier", "Draft — to settle in workshop"),
  expandAll: L("Tout déplier", "Expand all"),
  collapseAll: L("Tout replier", "Collapse all"),
  printBtnLabel: L("Imprimer", "Print"),
  pointsToSettle: L("points à trancher", "points to settle"),
  panelTitle: L("Comment lire l'écran Fin", "How to read the Fin screen"),
  panelSub: L(
    "Vocabulaire pour caler tout le monde avant l'atelier — on ne parle pas d'API, on remplit des cartes de branche.",
    "Vocabulary to get everyone aligned before the workshop — we don't talk about APIs, we fill in branch cards."
  ),
  legendColUI: L("Élément UI Fin", "Fin UI element"),
  legendColPlain: L("En clair", "In plain terms"),
  attrsUsed: L("Attributs utilisés", "Attributes used"),
  subprocsTitle: L("SOUS-PROCÉDURES RÉUTILISABLES", "REUSABLE SUB-PROCEDURES"),
  askTeammateLabel: L("ASK TEAMMATE", "ASK TEAMMATE"),
  askTeammateFoot: L(
    "Ask : Default · In : compte client + Slack · Collect : (2) · ~10 min",
    "Ask: Default · In: customer account + Slack · Collect: (2) · ~10 min"
  ),
  runSubProc: L("Run sub-procedure", "Run sub-procedure"),
  toSettle: L("à trancher", "to settle"),
  updateLabel: L("Update : ", "Update: "),
  callLabel: L("Call : ", "Call: "),
  typeLabels: {
    IF: L("SI", "IF"),
    ELSEIF: L("SINON SI", "ELSE IF"),
    ELSE: L("SINON", "ELSE")
  },
  legendRows: [
    { ui: "Procedure", plain: L("Parcours client (ex. demande de retour)", "Customer journey (e.g. return request)") },
    { ui: "SI / SINON SI", plain: L("Une branche de décision — « si telle condition… »", "A decision branch — “if such condition…”") },
    { uiHtml: '<span class="attr-chip">&lt;&gt; Attribute</span>', plain: L("Une info client ou commande (ex. Statut client = VIP)", "A customer or order fact (e.g. Customer status = VIP)") },
    { uiHtml: '<span class="update-chip">↑ Update</span>', plain: L("Question posée au client → la réponse est stockée", "A question asked to the customer → the answer is stored") },

/* ---------------- Helpers ---------------- */
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseTokens(raw){
  let s = esc(raw);
  s = s.replace(/\[\[attr:([^\]]+)\]\]/g, function(m, label){
    return '<span class="attr-chip">' + ICONS.attr + esc(label) + '</span>';
  });
  s = s.replace(/\[\[blank:([^\]]+)\]\]/g, function(m, label){
    return '<span class="blank-chip">' + esc(T(UI.toSettle)) + ' · ' + esc(label) + '</span>';
  });
  s = s.replace(/\[\[update:([^\]]+)\]\]/g, function(m, label){
    return '<span class="update-chip">' + ICONS.update + esc(T(UI.updateLabel)) + esc(label) + '</span>';
  });
  s = s.replace(/\[\[call:([^\]]+)\]\]/g, function(m, label){
    return '<span class="call-chip">' + ICONS.call + esc(T(UI.callLabel)) + esc(label) + '</span>';
  });
  return s;
}

function collectProcText(proc){
  const texts = [];
  if(proc.intro) texts.push(T(proc.intro));
  proc.sections.forEach(function(s){
    s.branches.forEach(function(b){
      texts.push(T(b.cond));
      b.actions.forEach(function(a){
        if(a.t) texts.push(T(a.t));
        if(a.n) texts.push(T(a.n));
      });
    });
  });
  return texts.join(' \n ');
}

function countBlanks(proc){
  const text = collectProcText(proc);
  const m = text.match(/\[\[blank:/g);
  return m ? m.length : 0;
}

function collectAttrs(proc){
  const text = collectProcText(proc);
  const set = new Set();
  const re = /\[\[attr:([^\]]+)\]\]/g;
  let m;
  while((m = re.exec(text))){ set.add(m[1]); }
  return Array.from(set);
}

function renderAction(a, idx){
  const kind = a.k || 'text';
  if(kind === 'sub'){
    return '<li class="action sub">' +
      '<span class="action-num">' + idx + '.</span>' +
      '<span class="action-body">' +
        '<span class="icon-chip violet">' + ICONS.sub + '</span>' +
        '<span class="subproc-link">' + esc(T(UI.runSubProc)) + '</span>' +
        '<span class="subproc-name">' + esc(T(a.n)) + '</span>' +
        '<span class="subproc-arrow">→</span>' +
      '</span>' +
    '</li>';
  }
  if(kind === 'team'){
    return '<li class="action">' +
      '<span class="action-num">' + idx + '.</span>' +
      '<span class="action-body">' +
        '<div class="team-card">' +
          '<div class="team-card-head">' +
            '<span class="icon-chip orange">' + ICONS.team + '</span>' +
            '<span>' + esc(T(UI.askTeammateLabel)) + '</span>' +
          '</div>' +
          '<div class="team-card-body">' + parseTokens(T(a.t)) + '</div>' +
          '<div class="team-card-foot">' + esc(T(UI.askTeammateFoot)) + '</div>' +
        '</div>' +
      '</span>' +
    '</li>';
  }
  if(kind === 'end'){
    return '<li class="action end">' +
      '<span class="action-num">' + idx + '.</span>' +
      '<span class="action-body">' + ICONS.end + '<span>' + esc(T(a.t)) + '</span></span>' +
    '</li>';
  }
  return '<li class="action">' +
    '<span class="action-num">' + idx + '.</span>' +
    '<span class="action-body">' + parseTokens(T(a.t)) + '</span>' +
  '</li>';
}

function renderBranch(b, num){
  const actionsHtml = b.actions.map(function(a,i){ return renderAction(a, i+1); }).join('');
  return '<div class="branch">' +
    '<div class="branch-num">' + num + '.</div>' +
    '<div class="branch-main">' +
      '<div class="branch-label-row">' +
        '<span class="type-chip">' + ICONS.branchArrow + '</span>' +
        '<span class="branch-label">' + esc(T(UI.typeLabels[b.type])) + '</span>' +
      '</div>' +
      '<div class="cond-box">' + parseTokens(T(b.cond)) + '</div>' +
      '<ol class="actions">' + actionsHtml + '</ol>' +
    '</div>' +
  '</div>';
}

function renderSection(sec, sIdx){
  const branchesHtml = sec.branches.map(function(b,i){ return renderBranch(b, (sIdx+1) + '.' + (i+1)); }).join('');
  return '<div class="section" data-section>' +
    '<div class="section-head" data-toggle>' +
      '<span class="section-chevron">' + ICONS.chevron + '</span>' +
      '<span class="section-title">' + esc(T(sec.label)) + '</span>' +
    '</div>' +
    '<div class="section-body">' + branchesHtml + '</div>' +
  '</div>';
}

function renderProcedure(proc){
  document.getElementById('procTitle').textContent = T(proc.name);
  document.getElementById('procSub').textContent = T(proc.sub);

  const attrs = collectAttrs(proc);
  const attrsHtml = attrs.length
    ? '<div class="attrs-row"><span class="attrs-label">' + esc(T(UI.attrsUsed)) + '</span>' +
      attrs.map(function(a){ return '<span class="attr-chip">' + ICONS.attr + esc(a) + '</span>'; }).join('') +
      '</div>'
    : '';

  const introHtml = proc.intro
    ? '<div class="intro-note">' + parseTokens(T(proc.intro)) + '</div>'
    : '';

  const sectionsHtml = proc.sections.map(function(s,i){ return renderSection(s,i); }).join('');

  const subprocsHtml = proc.subprocs && proc.subprocs.length
    ? '<div class="subprocs">' +
        '<div class="subprocs-title">' + esc(T(UI.subprocsTitle)) + '</div>' +
        '<div class="subprocs-list">' + proc.subprocs.map(function(n){
          return '<span class="subproc-chip"><span class="icon-chip violet" style="width:17px;height:17px;">' + ICONS.sub + '</span>' + esc(T(n)) + '</span>';
        }).join('') + '</div>' +
      '</div>'
    : '';

  document.getElementById('content').innerHTML = introHtml + attrsHtml + sectionsHtml + subprocsHtml;

  document.querySelectorAll('[data-toggle]').forEach(function(head){
    head.addEventListener('click', function(){
      head.closest('[data-section]').classList.toggle('collapsed');
    });
  });
}

/* ---------------- Sidebar / nav ---------------- */
let activeId = procedures[0].id;

function renderNav(){
  document.getElementById('sidebarTitle').textContent = T(UI.sidebarTitle) + ' — ' + procedures.length;
  document.getElementById('legendBtnLabel').textContent = T(UI.legendBtnLabel);
  document.getElementById('draftPill').textContent = T(UI.draftPill);
  document.getElementById('printBtnLabel').textContent = T(UI.printBtnLabel);

  const nav = document.getElementById('procNav');
  nav.innerHTML = procedures.map(function(p, i){
    const count = countBlanks(p);
    return '<li>' +
      '<button class="proc-item ' + (p.id===activeId?'active':'') + '" data-id="' + p.id + '">' +
        '<span class="proc-badge">' + (i+1) + '</span>' +
        '<span>' +
          '<div class="proc-item-name">' + esc(T(p.name)) + '</div>' +
          '<div class="proc-item-sub">' + esc(T(p.sub)) + '</div>' +
          (count ? '<span class="proc-item-count">' + count + ' ' + esc(T(UI.pointsToSettle)) + '</span>' : '') +
        '</span>' +
      '</button>' +
    '</li>';
  }).join('');

  nav.querySelectorAll('.proc-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeId = btn.getAttribute('data-id');
      selectProc(activeId);
    });
  });
}

function selectProc(id){
  const proc = procedures.find(function(p){ return p.id === id; });
  renderProcedure(proc);
  renderNav();
  window.scrollTo(0,0);
}

/* ---------------- Legend panel ---------------- */
function renderLegend(){
  document.getElementById('panelTitle').textContent = T(UI.panelTitle);
  document.getElementById('panelSub').textContent = T(UI.panelSub);

  const rows = UI.legendRows.map(function(r){
    const uiCell = r.uiHtml ? r.uiHtml : ('<b>' + esc(T(r.ui)) + '</b>');
    return '<tr><td>' + uiCell + '</td><td>' + esc(T(r.plain)) + '</td></tr>';
  }).join('');

  const atelier = UI.atelierItems.map(function(it){
    return '<li><span class="atelier-time">' + it.time + '</span><span>' + esc(T(it.text)) + '</span></li>';
  }).join('');

  document.getElementById('legendContent').innerHTML =
    '<table class="legend-table">' +
      '<thead><tr><th>' + esc(T(UI.legendColUI)) + '</th><th>' + esc(T(UI.legendColPlain)) + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    '<h3>' + esc(T(UI.atelierTitle)) + '</h3>' +
    '<ul class="atelier-list">' + atelier + '</ul>';
}

/* ---------------- Toolbar: expand / collapse all ---------------- */
let allExpanded = true;
function updateToggleAllLabel(){
  document.getElementById('toggleAllBtn').textContent = T(allExpanded ? UI.collapseAll : UI.expandAll);
}
document.getElementById('toggleAllBtn').addEventListener('click', function(){
  allExpanded = !allExpanded;
  document.querySelectorAll('[data-section]').forEach(function(sec){
    sec.classList.toggle('collapsed', !allExpanded);
  });
  updateToggleAllLabel();
});

/* ---------------- Legend panel toggle ---------------- */
const overlay = document.getElementById('overlay');
document.getElementById('legendBtn').addEventListener('click', function(){ overlay.classList.add('open'); });
document.getElementById('panelClose').addEventListener('click', function(){ overlay.classList.remove('open'); });
overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.classList.remove('open'); });

/* ---------------- Language switch ---------------- */
function setLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.getElementById('langFr').classList.toggle('active', lang === 'fr');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  renderNav();
  selectProc(activeId);
  renderLegend();
  updateToggleAllLabel();
}
document.getElementById('langFr').addEventListener('click', function(){ setLang('fr'); });
document.getElementById('langEn').addEventListener('click', function(){ setLang('en'); });

/* ---------------- Init ---------------- */
setLang('fr');
</script>
